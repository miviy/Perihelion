name: Build and tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Java 8 compiler and test runtime
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '8'
      - name: Record Java 8 toolchain
        run: echo "PERIHELION_JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Install Gradle runtime
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Test and verify distribution
        run: ./gradlew --no-daemon -Dorg.gradle.java.installations.paths="$PERIHELION_JAVA8_HOME" clean check assemble
      - name: Upload mod and verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Perihelion-${{ github.sha }}
          retention-days: 14
          path: |
            forge/build/libs/Perihelion-*.jar
            forge/build/reports/distribution.txt
            core/build/reports/tests/
            forge/build/reports/tests/
            build/reports/dependency-verification/
          if-no-files-found: warn
