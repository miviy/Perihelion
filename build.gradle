plugins {
    id 'base'
    id 'gg.essential.loom' version '1.3.12' apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
    id 'dev.architectury.architectury-pack200' version '0.1.3' apply false
}

allprojects {
    group = 'perihelion'
    version = providers.gradleProperty('modVersion').get()
    repositories {
        mavenCentral()
        maven { url = 'https://libraries.minecraft.net' }
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
    }
}

subprojects {
    apply plugin: 'java-library'
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(8)
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
    }
    dependencies { testImplementation 'junit:junit:4.13.2' }
    tasks.withType(Test).configureEach {
        systemProperty 'java.awt.headless', 'true'
        testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

tasks.register('checkArchitecture') {
    group = 'verification'
    description = 'Checks loader and Minecraft dependency boundaries.'
    doLast {
        fileTree('core/src/main/java').matching { include '**/*.java' }.each { f ->
            if (f.text =~ /(?m)^\s*import\s+(?:static\s+)?(?:net\.minecraft|net\.minecraftforge|org\.spongepowered|io\.netty|org\.lwjgl)\./) {
                throw new GradleException("Forbidden game/loader import in ${f}")
            }
        }
        fileTree('forge/src/main/java').matching { include '**/*.java'; exclude 'perihelion/bootstrap/forge/**' }.each { f ->
            if (f.text =~ /(?m)^\s*import\s+(?:static\s+)?(?:net\.minecraftforge|perihelion\.bootstrap\.forge)\./) {
                throw new GradleException("Forbidden Forge/bootstrap import in ${f}")
            }
        }
    }
}
tasks.named('check') { dependsOn 'checkArchitecture', ':core:check', ':forge:check' }
tasks.named('assemble') { dependsOn ':forge:remapJar' }

tasks.register('checkWrapper') {
    group = 'verification'
    doLast {
        def expected = '0336f591bc0ec9aa0c9988929b93ecc916b3c1d52aed202c7381db144aa0ef15'
        def actual = java.security.MessageDigest.getInstance('SHA-256')
                .digest(file('gradle/wrapper/gradle-wrapper.jar').bytes).encodeHex().toString()
        if (actual != expected) throw new GradleException('Gradle wrapper JAR checksum differs from the official 8.4 wrapper')
    }
}
tasks.named('check') { dependsOn 'checkWrapper' }
